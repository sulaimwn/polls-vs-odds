name: Refresh data and deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  # The exact hourly trigger comes from the Cloudflare timer in worker/ (GitHub's own schedule often runs hours late).
  # This schedule stays as a backup.
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install the site font for preview images
        run: |
          mkdir -p ~/.fonts
          curl -sfL -o ~/.fonts/LibreFranklin.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/librefranklin/LibreFranklin%5Bwght%5D.ttf" && fc-cache -f || true
      - name: Refresh member list
        run: curl -sf -o scripts/legislators-current.json https://unitedstates.github.io/congress-legislators/legislators-current.json || true
      - name: Photos for any new candidates
        run: node scripts/photos.mjs || true
      - name: Pull polls and markets, run the model
        run: node scripts/update.mjs
      - name: Link preview image for the homepage
        run: node scripts/og.mjs
      - name: Build the site, race pages and preview images
        run: node scripts/build-site.mjs _site
      - name: Create the Pages project on first run
        uses: cloudflare/wrangler-action@v3
        continue-on-error: true
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create pollsvsodds --production-branch=main
      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy _site --project-name=pollsvsodds --branch=main
